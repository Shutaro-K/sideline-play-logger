hange:not(.q-change) td{border-top:2px solid #b6c5d1}tbody tr[data-ending=Punt]{background:#ffdfb0}tbody tr[data-ending=FG]{background:#dceaff}tbody tr[data-ending=TD]{background:#ccead3}tbody tr[data-ending=TO]{background:#f7cece}.time-cell{font-variant-numeric:tabular-nums;font-weight:650}.play-cell{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.4}.play-cell strong{font-weight:650}.play-cell small{font-size:11px;color:#667d91;margin-right:7px}.ending-tag{float:right;margin-left:9px;font-size:10px;font-weight:750;padding:2px 6px;border-radius:4px;background:#ffffffb0;color:#29445e}.check-cell{text-align:center;color:#25765b;font-weight:700}.empty-row td{color:var(--muted);text-align:center}.full .entry{display:none}.full .log{flex:1;height:auto;border-top:0}.full .toolbar{height:52px;min-height:52px}.full .search{display:block}.full tbody td{height:53px;font-size:14px}.full thead th{height:34px}

@media(max-width:800px){.top{gap:5px;padding:5px 7px}.q{width:39px}.top-right{gap:8px}.clock{font-size:15px}.import{padding:0 7px}.entry{grid-template-columns:minmax(0,1fr) 29%;gap:6px}.field{padding:7px 5px}.field[data-field=sign] .value{font-size:22px}.distance{padding:7px 4px}.dist-options{grid-template-columns:repeat(3,1fr)}.dist-options button{font-size:12px}.notes{gap:5px;grid-template-columns:1.5fr 1fr 1fr}.observation{font-size:18px;gap:4px}.observation small{font-size:9px}.keypad{padding-left:6px}.keys{gap:5px}.commands{gap:5px;grid-template-columns:1fr 1.7fr}.enter{font-size:19px;gap:4px;flex-direction:column}.enter small{font-size:9px}.toolbar{gap:5px;padding:0 6px}.log-heading{display:none}.series-controls span{font-size:9px}.series-controls button{min-width:36px;padding:0 5px}.log-actions button{padding:0 6px}.full .search{width:85px}.count{min-width:28px}}

.note-trigger{display:none}.full .note-cell{padding:0}.full .note-summary{display:none}.full .note-trigger{display:block;width:100%;min-height:52px;border:0;border-radius:0;background:transparent;padding:10px 6px;text-align:inherit;font:inherit;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.full .note-trigger:hover,.full .note-trigger[aria-expanded=true]{background:#ffffff80;box-shadow:inset 0 0 0 2px #5686b2}.note-popover{position:fixed;z-index:20;display:flex;flex-direction:column;width:min(380px,calc(100vw - 24px));max-height:min(340px,calc(100dvh - 24px));background:#fff;border:1px solid #aabecf;border-radius:9px;box-shadow:0 9px 30px #132d4c2b;color:var(--ink)}.note-popover::before{content:"";position:absolute;width:12px;height:12px;background:white;left:var(--arrow-x,24px);top:-7px;transform:rotate(45deg);border-left:1px solid #aabecf;border-top:1px solid #aabecf}.note-popover[data-placement=above]::before{top:auto;bottom:-7px;transform:rotate(225deg)}.note-popover[data-placement=right]::before{left:-7px;top:var(--arrow-y,24px);transform:rotate(-45deg)}.note-popover[data-placement=left]::before{left:auto;right:-7px;top:var(--arrow-y,24px);transform:rotate(135deg)}.note-header{display:flex;align-items:center;gap:10px;padding:5px 10px 4px 13px;flex:none;border-bottom:1px solid #e4eaf0}.note-header button{margin-left:auto;border:0;background:transparent;width:36px;height:32px;font-size:23px;color:#6c8193;padding:0}.note-meta{font-size:11px;color:var(--muted);min-width:0}.note-content{padding:12px 13px;font-size:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;overscroll-behavior:contain;min-height:0;-webkit-user-select:text;user-select:text}
#storageNotice{position:relative;top:auto;left:auto;right:auto;flex:none;margin:4px 8px 0;max-height:88px;overflow:auto}.form{overflow:auto}

<body>
<div class="app" id="app">
  <header class="top topbar">
    <div class="quarter" role="group" aria-label="現在のQ"><b>Q</b><button class="q" data-q="1" aria-pressed="true">1</button><button class="q" data-q="2" aria-pressed="false">2</button><button class="q" data-q="3" aria-pressed="false">3</button><button class="q" data-q="4" aria-pressed="false">4</button><button class="q" data-q="OT" aria-pressed="false">OT</button></div>
    <div class="top-right"><button class="import" id="importBtn">CSV読込</button><input id="signCsvInput" type="file" accept=".csv,text/csv" hidden><time class="clock" id="clock">--:--:--</time></div>
  </header>
<div class="error" id="storageNotice" role="status" aria-live="polite" hidden><span id="storageMessage"></span><button id="retryStorage" hidden>復元を再試行</button></div>
  <main class="entry entry-stage" id="entry">
    <section class="form" aria-label="プレー入力">
      <div class="target"><strong id="target">新規 · Series 3</strong><span id="mappingLabel">対応CSV未読込</span><button id="cancelEdit" hidden>編集をやめる</button></div>
      <div class="fields">
        <button class="field active" data-field="down" aria-label="DN入力"><span class="label">DN</span><span class="value empty" id="value-down">—</span></button>
        <div class="distance" id="distance" role="group" aria-label="DIST選択"><span class="label">DIST <span id="value-distance" hidden></span></span><div class="dist-options"><button data-distance="S" aria-pressed="false">S</button><button data-distance="M" aria-pressed="false">M</button><button data-distance="L" aria-pressed="false">L</button><button data-distance="10" aria-pressed="false">10</button><button data-distance="10+" aria-pressed="false">10+</button></div></div>
        <button class="field" data-field="strSide" aria-label="STR入力"><span class="label">STR</span><span class="value empty" id="value-strSide">—</span></button>
        <button class="field" data-field="sign" aria-label="SIGN入力"><span class="label">SIGN</span><span class="value empty" id="value-sign">—</span></button>
      </div>
      <div class="lookup" id="lookupResult" aria-live="polite"><div class="lookup-head"><span class="label">PLAY</span><span class="lookup-status" id="lookupStatus">CSV未読込</span><button class="branch" id="cwmBranchInput" hidden>枝番 —</button></div><div class="formation" id="formation"></div><div class="play pending" id="play">Sign対応CSVを読み込んでください</div></div>
      <div class="notes"><label class="remark-wrap"><span class="label">REMARK</span><textarea id="remark" aria-label="Remark" spellcheck="false"></textarea></label><button class="observation" id="insideBtn">IN <span class="check" id="insideCheck"></span><small>記入 ›</small></button><button class="observation" id="outsideBtn">OUT <span class="check" id="outsideCheck"></span><small>記入 ›</small></button></div>
    </section>
    <section class="keypad" aria-label="専用テンキー"><div class="keys" id="keypad"><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key" data-key="L">L</button><button class="key" data-key="0">0</button><button class="key" data-key="R">R</button></div><div class="commands"><button class="backspace" id="backspace" aria-label="1文字削除">⌫</button><button class="enter" id="enter">Enter <small id="enterAction">次：DIST</small></button></div></section>
  </main>
  <section class="observation-page" id="observationPage" hidden aria-label="観察情報入力"><div class="page-head"><button id="backToEntry">‹ 入力に戻る</button><h1 id="observationTitle">VS INSIDE</h1></div><div class="page-target" id="observationTarget"></div><div class="coverage" id="coverageGroup" hidden><span>Coverage</span><button data-cover="0" aria-pressed="false">0</button><button data-cover="2" aria-pressed="false">2</button><button data-cover="4" aria-pressed="false">4</button><button data-cover="QH" aria-pressed="false">QH</button><button data-cover="" aria-pressed="true">未選択</button></div><textarea id="observationText" aria-label="観察メモ" spellcheck="false"></textarea><div class="page-foot"><span id="observationSaveHint"></span><button class="secondary" id="returnWithDraft">入力に戻る</button><button id="saveObservation">このプレーを記録</button></div></section>
  <section class="log" id="log" aria-label="PLAY LOG"><div class="toolbar log-toolbar"><b class="log-heading">PLAY LOG</b><div class="series-controls" aria-label="シリーズ終了"><span>シリーズ終了</span><button data-ending="Punt">Punt</button><button data-ending="FG">FG</button><button data-ending="TD">TD</button><button data-ending="TO">TO</button></div><div class="log-actions"><input class="search" id="search" type="search" placeholder="ログ検索" aria-label="ログ検索"><span class="count" id="count"></span><button id="resetBtn">リセット</button><button id="exportBtn">CSV出力</button><button id="toggleTable">表を拡大</button></div></div><div class="table-wrap" id="tableWrap"><table aria-label="プレー記録"><colgroup><col class="time"><col class="dd"><col class="str"><col class="play"><col class="inout"><col class="inout"><col class="remark"></colgroup><thead><tr><th>TIME</th><th>DD</th><th>STR</th><th>PLAY</th><th>IN</th><th>OUT</th><th>REMARK</th></tr></thead><tbody id="logBody"></tbody></table></div></section>
</div>
<aside class="note-popover" id="notePopover" role="dialog" aria-modal="false" aria-labelledby="noteTitle" hidden><strong id="noteTitle" hidden></strong><div class="note-header"><div class="note-meta" id="noteMeta"></div><button id="closeNote" aria-label="吹き出しを閉じる">×</button></div><div class="note-content" id="noteContent"></div></aside>
<div class="toast" id="toast" role="status" hidden></div>
<script src="storage.js"></script><script src="sign-lookup.js"></script>
<script>

'use strict';
const $=id=>document.getElementById(id),order=['down','distance','strSide','sign','remark'];
const blank=()=>({down:'',distance:'',strSide:'',sign:'',branch:'',remark:'',inside:'',outside:'',coverage:''});
const quarters=['1','2','3','4','OT'],distances=['S','M','L','10','10+'];
let draft=blank(),active='down',quarter='1',editing=null,parked=null,pageKind=null,full=false,mapping=null,logs=[],noteAnchor=null;
let ready=false,busy=true,recordSaveFailed=false,stateFailure=false,stateWrites=Promise.resolve();
function time(){return new Date().toLocaleTimeString('ja-JP',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function notify(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').hidden=true,2400);}
function storageNotice(message='',retry=false){$('storageMessage').textContent=message;$('storageNotice').hidden=!message;$('retryStorage').hidden=!retry;}
function failureNotice(){return recordSaveFailed?'未保存：記録の入力を保持しています。記録確定を再試行してください。':stateFailure?'入力途中の保存に失敗しました。画面の入力は保持しています。記録確定を再試行してください。':'';}
function setBusy(value){busy=value;document.querySelectorAll('.entry button,.entry textarea,.observation-page button,.observation-page textarea,.series-controls button,.q,#cancelEdit,#exportBtn,#resetBtn,#importBtn,#signCsvInput').forEach(el=>el.disabled=busy||!ready);document.querySelectorAll('.series-controls button').forEach(el=>el.disabled=busy||!ready||!logs.length);}
function uiState(overrides={}){return {version:1,draft:{...draft},active,quarter,editing,parked:parked?structuredClone(parked):null,pageKind,...overrides};}
function persistState(){
 if(!ready||busy)return;
 const snapshot=uiState();
 stateWrites=stateWrites.then(()=>PlayLogStore.saveState(snapshot)).then(()=>{if(stateFailure){stateFailure=false;if(!recordSaveFailed)storageNotice();}}).catch(()=>{stateFailure=true;storageNotice(failureNotice());});
}
async function restoreRecords(){
 setBusy(true);$('retryStorage').disabled=true;storageNotice('記録・対応表を復元しています…');
 try{
  logs=await PlayLogStore.load();const saved=await PlayLogStore.loadMapping();mapping=saved?SignLookup.validateRows(saved.rows):null;const state=await PlayLogStore.loadState();
  quarter=quarters.includes(state?.quarter)?state.quarter:[...logs].reverse().find(r=>quarters.includes(r.q))?.q||'1';
  draft={...blank(),...(state?.draft||{})};active=[...order,'branch'].includes(state?.active)?state.active:'down';editing=state?.editing??null;parked=state?.parked||null;pageKind=['inside','outside'].includes(state?.pageKind)?state.pageKind:null;
  if(editing!==null&&!logs.some(r=>r.id===editing)){draft={...blank(),...(parked?.draft||{})};active=parked?.active||'down';editing=null;parked=null;pageKind=null;}
  ready=true;recordSaveFailed=false;stateFailure=false;storageNotice();render();
 }catch(error){ready=false;storageNotice('記録・対応表を復元できません。上書きを防ぐため記録操作を停止しています。別のタブを閉じるなどして再試行してください。',true);}
 finally{setBusy(false);$('retryStorage').disabled=false;if(ready&&pageKind)openObservation(pageKind);}
}
function details(){const row=logs.find(r=>r.id===editing);return row&&row.sign===draft.sign&&(row.branch||'')===draft.branch?{...row,lookupStatus:row.lookupStatus||'legacy'}:SignLookup.resolve(mapping,draft.sign,draft.branch);}
function upcomingSeries(){const last=logs.at(-1);return last?(last.series||1)+(last.ending?1:0):1;}
function targetText(){const r=logs.find(r=>r.id===editing);return r?'編集 · Series '+(r.series||'—')+' / Play '+(logs.indexOf(r)+1)+' · '+(r.down||'—')+'-'+(r.distance||'—')+' · Sign '+(r.sign||'—'):'新規 · Series '+upcomingSeries();}
function select(name){if(!ready||busy)return;active=name;renderForm();if(name==='remark')$('remark').focus();else document.activeElement?.blur();}
function renderForm(){
 for(const name of ['down','strSide','sign']){const v=$('value-'+name);v.textContent=draft[name]?(draft[name]+(name==='sign'&&draft.branch?' · '+draft.branch:'')):'—';v.classList.toggle('empty',!draft[name]);const b=document.querySelector('[data-field='+name+']');b.classList.toggle('active',active===name);b.setAttribute('aria-pressed',String(active===name));}
 $('distance').classList.toggle('active',active==='distance');document.querySelectorAll('[data-distance]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.distance===draft.distance)));$('value-distance').textContent=draft.distance||'—';$('value-distance').hidden=!draft.distance||distances.includes(draft.distance);
 if($('remark').value!==draft.remark)$('remark').value=draft.remark;$('remark').classList.toggle('active',active==='remark');
 $('target').textContent=targetText();$('cancelEdit').hidden=editing===null;$('enterAction').textContent=editing!==null?'更新する':['sign','remark','branch'].includes(active)?'記録する':'次：'+({down:'DIST',distance:'STR',strSide:'SIGN'}[active]||'SIGN');
 for(const kind of ['inside','outside']){const has=Boolean(draft[kind].trim()||(kind==='outside'&&draft.coverage));$(kind+'Check').textContent=has?'✓':'';$(kind+'Btn').classList.toggle('filled',has);}
 const d=details();$('formation').textContent=d.formation||'';$('play').textContent=d.play||(!mapping?'Sign対応CSVが未読込です（未照合のまま記録できます）':draft.sign?'照合なし · '+draft.sign:'SIGNを入力');$('play').classList.toggle('pending',!d.play||d.lookupStatus==='cwm_pending');
 $('lookupStatus').textContent=({not_loaded:'CSV未読込',empty:mapping?'':'CSV未読込',unmatched:'未照合',matched:d.protection?'照合済み／PP'+d.protection:'照合済み',pp_common:'共通プレー照合済み／PP'+d.protection+'（保護ルール未登録）',pp_ambiguous:'共通プレー未確定／PP'+d.protection,cwm_pending:'枝番未確定',cwm_resolved:'子プレー確定',legacy:'保存済み'}[d.lookupStatus]||'');
 const parent=mapping?.bySign.get(draft.sign)?.record_type==='cwm_parent'||(d.parentSign===draft.sign&&draft.sign);$('cwmBranchInput').hidden=!parent;$('cwmBranchInput').textContent='枝番 '+(draft.branch||'—')+' · 1 / 2';$('cwmBranchInput').classList.toggle('active',active==='branch');
 document.querySelectorAll('[data-q]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.q===quarter)));$('mappingLabel').textContent=mapping?'対応CSV '+mapping.rows.length+'件':'対応CSV未読込';$('importBtn').textContent=mapping?'CSV読込 / '+mapping.rows.length+'件':'CSV読込';persistState();
}
function cell(row,text,className=''){const el=document.createElement('td');el.textContent=text;el.className=className;row.append(el);return el;}
function readableCell(tr,text,kind,row,className=''){
 const td=cell(tr,'','note-cell '+className),summary=document.createElement('span');summary.className='note-summary';summary.textContent=text;td.append(summary);
 if(!text.trim())return;
 const button=document.createElement('button');button.className='note-trigger';button.dataset.kind=kind;button.textContent=text;button.setAttribute('aria-label',({inside:'IN',outside:'OUT',remark:'Remark'}[kind])+'の内容を表示');button.setAttribute('aria-controls','notePopover');button.setAttribute('aria-expanded','false');button.onclick=e=>{e.stopPropagation();showNote(button,row,kind);};td.append(button);
}
function closeNote(restoreFocus=false){
 $('notePopover').hidden=true;if(noteAnchor){noteAnchor.setAttribute('aria-expanded','false');if(restoreFocus&&noteAnchor.isConnected)noteAnchor.focus();}noteAnchor=null;
}
function showNote(anchor,row,kind){
 if(!full)return;if(noteAnchor===anchor&&!$('notePopover').hidden){closeNote();return;}closeNote();noteAnchor=anchor;
 const popup=$('notePopover');$('noteTitle').textContent={inside:'VS INSIDE',outside:'VS OUTSIDE',remark:'REMARK'}[kind];$('noteMeta').textContent='Series '+(row.series||'—')+' / Play '+(logs.indexOf(row)+1)+' · '+row.time;
 $('noteContent').textContent=kind==='outside'?[row.coverage?'Coverage：'+row.coverage:'',row.outside].filter(Boolean).join('\n'):row[kind];$('noteContent').scrollTop=0;
 popup.style.maxHeight='min(340px, calc(100dvh - 24px))';popup.hidden=false;anchor.setAttribute('aria-expanded','true');
 const r=anchor.getBoundingClientRect(),margin=12,gap=10,vw=document.documentElement.clientWidth,vh=window.innerHeight,w=popup.offsetWidth;
 let h=popup.offsetHeight,side='below',x=r.left+r.width/2-w/2,y=r.bottom+gap;
 const below=vh-margin-r.bottom-gap,above=r.top-margin-gap;
 if(below<h){
  if(above>=h){side='above';y=r.top-gap-h;}
  else if(vw-margin-r.right-gap>=w){side='right';x=r.right+gap;y=r.top+r.height/2-h/2;}
  else if(r.left-margin-gap>=w){side='left';x=r.left-gap-w;y=r.top+r.height/2-h/2;}
  else {side=below>=above?'below':'above';popup.style.maxHeight=Math.max(80,side==='below'?below:above)+'px';h=popup.offsetHeight;y=side==='below'?r.bottom+gap:r.top-gap-h;}
 }
 x=Math.max(margin,Math.min(vw-margin-w,x));y=Math.max(margin,Math.min(vh-margin-h,y));popup.style.left=x+'px';popup.style.top=y+'px';popup.dataset.placement=side;
 popup.style.setProperty('--arrow-x',Math.max(16,Math.min(w-28,r.left+r.width/2-x-6))+'px');popup.style.setProperty('--arrow-y',Math.max(16,Math.min(h-28,r.top+r.height/2-y-6))+'px');
}

function renderLogs(){
 closeNote();const body=$('logBody');body.replaceChildren();const term=$('search').value.trim().toLowerCase();let shown=0;
 logs.forEach((r,i)=>{if(term&&!Object.values(r).join(' ').toLowerCase().includes(term))return;shown++;const tr=document.createElement('tr');tr.dataset.id=r.id;tr.dataset.ending=r.ending||'';if(i&&logs[i-1].q&&r.q&&logs[i-1].q!==r.q)tr.classList.add('q-change');if(i&&logs[i-1].series&&r.series&&logs[i-1].series!==r.series)tr.classList.add('series-change');tr.tabIndex=0;tr.setAttribute('aria-label','Play '+(i+1)+' を編集');
 cell(tr,r.time,'time-cell');cell(tr,(r.down||'—')+'-'+(r.distance||'—'));cell(tr,r.strSide||'—');const p=cell(tr,'','play-cell');if(r.ending){const tag=document.createElement('span');tag.className='ending-tag';tag.textContent=r.ending;p.append(tag);}const f=document.createElement('small');f.textContent=r.formation||'';p.append(f);const play=document.createElement('strong');play.textContent=r.play||(r.sign?'Sign '+r.sign:'—');p.append(play);
 readableCell(tr,(r.inside||'').trim()?'✓':'','inside',r,'check-cell');readableCell(tr,(r.outside||'').trim()||r.coverage?'✓':'','outside',r,'check-cell');readableCell(tr,r.remark||'','remark',r);tr.addEventListener('click',()=>editRecord(r.id));tr.addEventListener('keydown',e=>{if(e.target.closest('button'))return;if(e.key==='Enter'){e.preventDefault();e.stopPropagation();editRecord(r.id);}});body.append(tr);
 });if(!shown){const tr=document.createElement('tr');tr.className='empty-row';const td=cell(tr,logs.length?'該当する記録がありません':'記録はありません');td.colSpan=7;body.append(tr);}$('count').textContent=logs.length+' plays'+(term?' / '+shown+' found':'');document.querySelectorAll('.series-controls button').forEach(b=>b.disabled=!ready||busy||!logs.length);
}
function render(){renderForm();renderLogs();}
function inputKey(key){
 if(!ready||busy)return;
 if(key==='L'||key==='R'){draft.strSide=key;active='sign';}
 else if(active==='down'&&/^[1-4]$/.test(key))draft.down=key;
 else if(active==='sign'&&/^\d$/.test(key)){
  if(draft.sign.length<5){draft.sign+=key;draft.branch='';}
  else if(!$('cwmBranchInput').hidden&&['1','2'].includes(key))draft.branch=key;
 }
 else if(active==='branch'&&['1','2'].includes(key))draft.branch=key;
 else if(active==='remark'){const el=$('remark'),start=el.selectionStart,end=el.selectionEnd;draft.remark=draft.remark.slice(0,start)+key+draft.remark.slice(end);renderForm();el.focus();el.setSelectionRange(start+key.length,start+key.length);return;}
 renderForm();
}
function backspace(){
 if(!ready||busy)return;
 if((active==='sign'||active==='branch')&&draft.branch)draft.branch='';else if(active==='branch'){active='sign';draft.sign=draft.sign.slice(0,-1);}else if(active==='distance')draft.distance='';else if(active==='remark'){const el=$('remark'),s=el.selectionStart,e=el.selectionEnd;const cut=s===e?Math.max(0,s-1):s;draft.remark=draft.remark.slice(0,cut)+draft.remark.slice(e);renderForm();el.focus();el.setSelectionRange(cut,cut);return;}else if(Object.hasOwn(draft,active))draft[active]=draft[active].slice(0,-1);renderForm();
}
function enter(){if(!ready||busy)return;if(editing!==null||['sign','remark','branch'].includes(active))saveRecord();else select(order[order.indexOf(active)+1]||'sign');}
async function saveRecord(){
 if(!ready||busy)return;const original=logs.find(r=>r.id===editing);if(editing!==null&&!original){storageNotice('編集対象が見つかりません。入力内容を保持しています。');return;}
 const d=details(),lookup=Object.fromEntries(['formation','play','lookupStatus','resolvedSign','parentSign','cwmBranch','protection','lookupSourceSign'].map(k=>[k,d[k]||'']));
 const record=original?{...original,...draft,...lookup,updatedAt:new Date().toISOString()}:{...draft,...lookup,q:quarter,series:upcomingSeries(),time:time(),recordedAt:new Date().toISOString()};
 const next=uiState({draft:original?(parked?.draft||blank()):blank(),active:original?(parked?.active||'down'):'down',editing:null,parked:null,pageKind:null});
 setBusy(true);await stateWrites;
 try{if(original){await PlayLogStore.update(record,next);logs[logs.findIndex(r=>r.id===original.id)]=record;}else logs.push(await PlayLogStore.add(record,next));draft={...next.draft};active=next.active;editing=null;parked=null;recordSaveFailed=false;stateFailure=false;storageNotice();showEntry();render();notify(original?'同じプレーを更新しました（時刻は維持）':'プレーを保存しました');requestAnimationFrame(()=>$('tableWrap').scrollTop=$('tableWrap').scrollHeight);}
 catch(error){recordSaveFailed=true;storageNotice('未保存：保存できませんでした。入力内容は残しています。記録確定を再試行してください。');}
 finally{setBusy(false);}
}
function editRecord(id){
 if(!ready||busy)return;const row=logs.find(r=>r.id===id);if(!row)return;if(recordSaveFailed&&editing!==id){storageNotice(failureNotice());return;}closeNote();if(editing===null)parked={draft:{...draft},active};editing=id;draft=Object.fromEntries(Object.keys(blank()).map(k=>[k,row[k]||'']));active='sign';full=false;$('app').classList.remove('full');$('toggleTable').textContent='表を拡大';showEntry();renderForm();
}
function cancelEdit(){if(!ready||busy)return;draft={...blank(),...(parked?.draft||{})};active=parked?.active||'down';editing=null;parked=null;recordSaveFailed=false;storageNotice();showEntry();renderForm();}
function showEntry(){pageKind=null;$('observationPage').hidden=true;$('entry').hidden=false;$('log').hidden=false;}
function openObservation(kind){if(!ready||busy)return;pageKind=kind;$('entry').hidden=true;$('log').hidden=true;$('observationPage').hidden=false;$('observationTitle').textContent=kind==='inside'?'VS INSIDE':'VS OUTSIDE';$('observationTarget').textContent=targetText()+' · DN '+(draft.down||'—')+' / '+(draft.sign||'Sign未入力')+' '+(details().play||'');$('observationText').value=draft[kind];$('observationText').placeholder=kind==='inside'?'Front / stunt / Blitz など':'個別の担当、選択肢にないCoverageなど';$('coverageGroup').hidden=kind!=='outside';document.querySelectorAll('[data-cover]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cover===draft.coverage)));$('saveObservation').textContent=editing!==null?'このプレーを更新':'このプレーを記録';$('observationSaveHint').textContent='戻ると入力途中の内容を保持';persistState();}
function returnFromObservation(){showEntry();renderForm();}
async function endSeries(label){
 if(!ready||busy||!logs.length)return;const r=logs.at(-1);if(!confirm('Series '+(r.series||1)+' / Play '+logs.length+'（'+r.time+'）に「'+label+'」を付けます。\n次の新規プレーから次シリーズになります。'))return;
 setBusy(true);await stateWrites;const record={...r,series:r.series||1,ending:label};
 try{await PlayLogStore.update(record,uiState());logs[logs.length-1]=record;render();storageNotice(failureNotice());notify('シリーズ終了：'+label);}catch(error){storageNotice('シリーズ終了を保存できませんでした。元の記録と入力内容は保持しています。再試行してください。');}finally{setBusy(false);}
}
async function resetRecords(){
 if(!ready||busy)return;if(logs.length&&!confirm('CSVファイルを端末に保存し、内容を確認しましたか？\n確認済みの場合のみ「OK」を押してください。'))return;if(!confirm('すべての記録を削除します。この操作は取り消せません。よろしいですか？'))return;
 setBusy(true);await stateWrites;const next=uiState({draft:blank(),active:'down',editing:null,parked:null,pageKind:null});
 try{await PlayLogStore.clear(next);logs=[];draft=blank();active='down';editing=null;parked=null;recordSaveFailed=false;stateFailure=false;$('search').value='';showEntry();render();storageNotice();notify('すべての記録を削除しました');}catch(error){storageNotice('リセットできませんでした。記録と入力は残しています。再試行してください。');}finally{setBusy(false);}
}
function csvEscape(value){const s=String(value??'');return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s;}
function exportCSV(){if(!ready||busy)return;const columns=['Time','Down','Distance','Str Side','Sign','Formation','Play','Remark','Lookup Status','Resolved Sign','Parent Sign','CWM Branch','Q','Series','Inside','Coverage','Outside','Series End','Protection','Lookup Source Sign'];const rows=logs.map(r=>[r.time,r.down,r.distance,r.strSide,r.sign,r.formation,r.play,r.remark,r.lookupStatus||'legacy',r.resolvedSign||'',r.parentSign||'',r.cwmBranch||'',r.q||'',r.series||'',r.inside||'',r.coverage||'',r.outside||'',r.ending||'',r.protection||'',r.lookupSourceSign||'']);const csv='\uFEFF'+[columns,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='sideline_log_'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function importSigns(file){
 if(!file||!ready||busy)return;setBusy(true);await stateWrites;
 try{const text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());const validated=SignLookup.parse(text);await PlayLogStore.saveMapping({rows:validated.rows,importedAt:new Date().toISOString()});mapping=validated;renderForm();storageNotice(failureNotice());notify('Sign対応CSVを保存しました（'+validated.rows.length+'件）');}catch(error){storageNotice('CSVを適用できません。既存の対応表は保持しています。 '+error.message+' '+failureNotice());}finally{$('signCsvInput').value='';setBusy(false);}
}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{quarter=b.dataset.q;renderForm();notify('現在Q：'+quarter+' · 次の新規記録から反映');});
document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>select(b.dataset.field));
document.querySelectorAll('[data-distance]').forEach(b=>b.onclick=()=>{draft.distance=draft.distance===b.dataset.distance?'':b.dataset.distance;select(draft.distance?'strSide':'distance');});
document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{if(active==='remark')e.preventDefault();});b.onclick=()=>inputKey(b.dataset.key);});
$('remark').onfocus=()=>{active='remark';renderForm();};$('remark').oninput=e=>{draft.remark=e.target.value;persistState();};
$('enter').addEventListener('pointerdown',e=>e.preventDefault());$('backspace').addEventListener('pointerdown',e=>e.preventDefault());$('enter').onclick=enter;$('backspace').onclick=backspace;
$('cwmBranchInput').onclick=()=>select('branch');$('cancelEdit').onclick=cancelEdit;
$('insideBtn').onclick=()=>openObservation('inside');$('outsideBtn').onclick=()=>openObservation('outside');$('backToEntry').onclick=returnFromObservation;$('returnWithDraft').onclick=returnFromObservation;$('saveObservation').onclick=saveRecord;$('observationText').oninput=e=>{draft[pageKind]=e.target.value;persistState();};
document.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>{draft.coverage=b.dataset.cover;document.querySelectorAll('[data-cover]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cover===draft.coverage)));persistState();});
document.querySelectorAll('[data-ending]').forEach(b=>b.onclick=()=>endSeries(b.dataset.ending));
$('toggleTable').onclick=()=>{closeNote();full=!full;$('app').classList.toggle('full',full);$('toggleTable').textContent=full?'入力に戻る':'表を拡大';};$('search').oninput=renderLogs;$('exportBtn').onclick=exportCSV;$('resetBtn').onclick=resetRecords;
$('closeNote').onclick=()=>closeNote(true);
document.addEventListener('click',e=>{if($('notePopover').hidden||$('notePopover').contains(e.target)||noteAnchor?.contains(e.target))return;closeNote();if(e.target.closest('#logBody tr')&&!e.target.closest('.note-trigger')){e.preventDefault();e.stopPropagation();}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('notePopover').hidden){e.preventDefault();closeNote(true);}});
$('tableWrap').addEventListener('scroll',()=>closeNote(),{passive:true});window.addEventListener('resize',()=>closeNote());
$('importBtn').onclick=()=>{if(ready&&!busy)$('signCsvInput').click();};$('signCsvInput').onchange=e=>importSigns(e.target.files[0]);$('retryStorage').onclick=restoreRecords;
document.addEventListener('keydown',e=>{
 if(!ready||busy||e.isComposing||e.keyCode===229||e.metaKey||e.ctrlKey||e.altKey||pageKind||e.target.closest('input, textarea, #notePopover')||e.target.closest('tbody'))return;
 if(e.target.closest('button')&&!e.target.closest('.keypad'))return;
 if(e.key==='Enter'){e.preventDefault();enter();}else if(e.key==='Backspace'){e.preventDefault();backspace();}else if(e.key==='Tab'){e.preventDefault();select(order[(order.indexOf(active)+1)%order.length]);}else if(/^[0-9LRlr]$/.test(e.key)){e.preventDefault();inputKey(e.key.toUpperCase());}
});
$('clock').textContent=time();setInterval(()=>$('clock').textContent=time(),1000);render();restoreRecords();

</script>
